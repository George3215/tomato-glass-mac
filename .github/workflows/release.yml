name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Countdown tests
        run: ./scripts/test.sh
      - name: Build Universal DMG
        run: ./scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tomato-Glass-DMG
          path: dist/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keep its reviewed assets unchanged."
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Tomato Glass $GITHUB_REF_NAME" --notes-file docs/RELEASING.md
          fi
